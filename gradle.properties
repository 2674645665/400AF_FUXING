# ---------------------------------------------------------------------------
# 400AF 模组构建参数
# 版本组合与 HeXie (1.21.1-NeoForge-0.9.3) 保持一致
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 网络：避免某个不可达仓库把构建卡死（国内访问 maven.neoforged.net 常超时）
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.org.gradle.internal.repository.initial.backoff=500

# --- 模组自身 ---
mod_id=af400
mod_name=400AF
mod_license=MIT
mod_version=0.0.2_A1
mod_group_id=com.af400.af400
mod_authors=晨星_CX
mod_description=CR400AF 复兴号动车组 —— 结构与内容建设中

# --- 平台 / 依赖版本 ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
neo_version_range=[21.1.233,)
loader_version_range=[4,)

# --- 机械动力 Create 6.0.x ---
create_version=6.0.10-281
create_version_range=[6.0.10,6.1)
# Create 的传递依赖版本（虚影/预览用 Ponder，渲染用 Flywheel）
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# 本地开发：指向已经装在 mods 目录里的 Create jar，离线也能编译。
# 留空则走 maven.createmod.net。
create_local_jar=

# --- HeXie（必需依赖）---
# 400AF 定位为 HeXie 的附属组件，直接复用其 api/display 等公开接口实现：
#   电子水牌、车厢号显示屏、跨模组车厢混编
# 以后计划并入 HeXie 本体，届时这些依赖会自然消化。
hexie_modid=hexie
hexie_version_range=[0.10.4-Shiroko-bata,1.0.0)
# 本地开发：指向 mods 目录里的 HeXie jar（离线可编译）
hexie_local_jar=

# --- SimuRail（可选依赖，和 HeXie 一样）---
simurail_version=0.1.0
simurail_version_range=[0.1.0,0.2)
