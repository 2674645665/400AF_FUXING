# ---------------------------------------------------------------------------
# 400AF 模组构建参数
# 版本组合与 HeXie (1.21.1-NeoForge-0.9.3) 保持一致
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 网络：避免某个不可达仓库把构建卡死（国内访问 maven.neoforged.net 常超时）
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.org.gradle.internal.repository.initial.backoff=500

# --- 模组自身 ---
mod_id=af400
mod_name=400AF
mod_license=MIT
mod_version=0.0.1
mod_group_id=com.af400.af400
mod_authors=晨星_CX
mod_description=CR400AF 复兴号动车组 —— 结构与内容建设中

# --- 平台 / 依赖版本 ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
neo_version_range=[21.1.233,)
loader_version_range=[4,)

# --- 机械动力 Create 6.0.x ---
create_version=6.0.10
create_version_range=[6.0.10,6.1)

# --- SimuRail（可选依赖，和 HeXie 一样）---
simurail_version=0.1.0
simurail_version_range=[0.1.0,0.2)
