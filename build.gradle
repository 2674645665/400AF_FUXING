plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.23'
}

// ---------------------------------------------------------------------------
// 版本号约定（见 tools/version.ps1）
//   mod_version = 0.0.2      -> 加方块版本
//   mod_version = 0.0.2_A1   -> 普通更新版本
// 文件名里用连字符代替下划线，避免和 MC 版本的 '+' 语义混淆：
//   400AF-1.21.1-neoforge-0.0.2.jar
//   400AF-1.21.1-neoforge-0.0.2-A1.jar
// ---------------------------------------------------------------------------
def fileVersion = "${mod_version}".replace('_', '-')

version = "${fileVersion}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// 网络受限环境兜底（本机 maven.neoforged.net 不可达）
// 把内部配置里请求的 NFRT 运行时强制换成本地已有的版本。
// 正常网络环境下可整段删除。
// ---------------------------------------------------------------------------


repositories {
    // 本地 maven 仓库优先（maven.neoforged.net 在部分网络下不可达时，
    // 可把依赖预先放进 ~/.m2/repository）。
    // 用 -PlocalRepoOnly 可完全禁用远程仓库，强制只用本地。
    maven {
        url = uri("${System.getProperty('user.home')}/.m2/repository")
        metadataSources { artifact(); gradleMetadata() }
    }
    mavenLocal()
    if (!providers.gradleProperty('localRepoOnly').isPresent()) {
        maven { url = 'https://maven.createmod.net' }            // Create / Ponder / Flywheel
        maven { url = 'https://maven.ithundxr.dev/snapshots' }   // Flywheel 快照
        maven {
            url = 'https://maven.blamejared.com'
            content { includeGroup 'mezz.jei' }
        }
        maven { url = 'https://maven.squiddev.cc' }              // CC:Tweaked（如需要）
        maven { url = 'https://maven.ftb.dev/releases' }
        mavenCentral()
    }
}

neoForge {
    version = "${neo_version}"

    parchment {
        // 可选：官方映射注释，不需要就把下面三行删掉
        // minecraftVersion = "${minecraft_version}"
        // mappingsVersion = '2024.11.17'
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.logging.console.level', 'debug'
            // 中文 JVM 参数，避免控制台乱码
            jvmArgument '-Dfile.encoding=UTF-8'
        }

        client {
            client()
            gameDirectory = file('run/client')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            gameDirectory = file('run/data')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// ---------------------------------------------------------------------------
// 资源处理：把 gradle.properties 里的值替换进 neoforge.mods.toml / mixins
// ---------------------------------------------------------------------------
def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        create_version         : create_version,
        create_version_range   : create_version_range,
        simurail_version       : simurail_version,
        simurail_version_range : simurail_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
    filesMatching(['**/*.mixins.json']) {
        // mixins 里一般不需要替换，留空但保留钩子
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
