plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.23'
}

// ---------------------------------------------------------------------------
// 版本号约定（见 tools/version.ps1）
//   mod_version = 0.0.2      -> 加方块版本
//   mod_version = 0.0.2_A1   -> 普通更新版本
// 文件名里用连字符代替下划线，避免和 MC 版本的 '+' 语义混淆：
//   400AF-1.21.1-neoforge-0.0.2.jar
//   400AF-1.21.1-neoforge-0.0.2-A1.jar
// ---------------------------------------------------------------------------
def fileVersion = "${mod_version}".replace('_', '-')

version = "${fileVersion}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// 网络受限环境兜底（本机 maven.neoforged.net 不可达）
// 把内部配置里请求的 NFRT 运行时强制换成本地已有的版本。
// 正常网络环境下可整段删除。
// ---------------------------------------------------------------------------


repositories {
    // 本地 maven 仓库优先（maven.neoforged.net 在部分网络下不可达时，
    // 可把依赖预先放进 ~/.m2/repository）。
    // 用 -PlocalRepoOnly 可完全禁用远程仓库，强制只用本地。
    maven {
        url = uri("${System.getProperty('user.home')}/.m2/repository")
        metadataSources { artifact(); gradleMetadata() }
    }
    mavenLocal()
    if (!providers.gradleProperty('localRepoOnly').isPresent()) {
        maven { url = 'https://maven.createmod.net' }            // Create / Ponder / Flywheel
        maven { url = 'https://maven.ithundxr.dev/snapshots' }   // Flywheel 快照
        maven {
            url = 'https://maven.blamejared.com'
            content { includeGroup 'mezz.jei' }
        }
        maven { url = 'https://maven.squiddev.cc' }              // CC:Tweaked（如需要）
        maven { url = 'https://maven.ftb.dev/releases' }
        mavenCentral()
    }
}

neoForge {
    version = "${neo_version}"

    parchment {
        // 可选：官方映射注释，不需要就把下面三行删掉
        // minecraftVersion = "${minecraft_version}"
        // mappingsVersion = '2024.11.17'
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.logging.console.level', 'debug'
            // 中文 JVM 参数，避免控制台乱码
            jvmArgument '-Dfile.encoding=UTF-8'
        }

        client {
            client()
            gameDirectory = file('run/client')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            gameDirectory = file('run/data')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// ---------------------------------------------------------------------------
// 本地路径覆盖
//
// gradle.properties 里 local_jar 一律留空（那文件要提交）；
// 本地开发把真实路径写进 gradle.local.properties（已在 .gitignore 里），
// 这里把它读进来覆盖同名属性。
//
// 为什么需要这层：CI 跑在 Linux 上，如果 gradle.properties 里留着
// C:/Users/... 这种带中文和括号的 Windows 路径，
// file(path) 会直接抛 URISyntaxException，连 .exists() 都走不到，构建必挂。
// ---------------------------------------------------------------------------
def localProps = new File(rootDir, 'gradle.local.properties')
if (localProps.exists()) {
    def props = new Properties()
    localProps.withInputStream { props.load(it) }
    props.each { k, v ->
        if (findProperty(k.toString()) == null || findProperty(k.toString()) == '') {
            ext.set(k.toString(), v)
        }
    }
    logger.lifecycle("[400AF] 已加载本地路径覆盖: gradle.local.properties")
}

// ---------------------------------------------------------------------------
// 第三方依赖
//
// 本地开发时可以直接指向 mods 目录里的 jar（离线可用）：
//   在 gradle.local.properties 里设置  create_local_jar=<路径>
// 或者走 Create 官方 maven（CI 上走这条）。
// ---------------------------------------------------------------------------
def createLocalJar = findProperty('create_local_jar')

/**
 * 判断本地路径是否可用。
 *
 * <p>不能直接用 file(x).exists()：路径里一旦有中文/括号/空格等字符，
 * Gradle 内部的 URI 解析可能先抛 IllegalArgumentException / URISyntaxException。
 * 这里全部兜住，失败就当「没有本地 jar」，退回 maven。
 */
def localJarExists = { String path ->
    if (!path) return false
    try {
        def f = new File(path)
        return f.isFile()
    } catch (Throwable ignored) {
        return false
    }
}

if (localJarExists(createLocalJar)) {
    dependencies {
        // compileOnly + runtimeOnly：不打包进我们的 jar，运行时由游戏提供
        compileOnly files(createLocalJar)
        runtimeOnly files(createLocalJar)
    }
    logger.lifecycle("[400AF] 使用本地 Create jar: ${createLocalJar}")
} else {
    dependencies {
        // Create 6.x 官方坐标（需要能访问 maven.createmod.net）
        implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") { transitive = false }
        compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
        implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    }
}

// ---------------------------------------------------------------------------
// HeXie —— 必需依赖（400AF 定位为其附属组件）
//
// 查找顺序：
//   1. gradle.local.properties 里的 hexie_local_jar（本机 mods 目录，最新）
//   2. libs/ 目录下的 jar（随仓库提交，CI 用这个）
//
// 为什么把 jar 放进仓库：
//   HeXie 没有稳定的 maven 坐标，Modrinth/CurseForge 直链不稳，
//   CI 每次都拉会随机失败。而它代码是 MIT 许可，作为编译期依赖随仓库携带是合规的。
//   注意：我们只把它当 compileOnly（不打包进产物），运行时分发仍由玩家自己装 HeXie。
// ---------------------------------------------------------------------------
def hexieLocalJar = findProperty('hexie_local_jar')

def hexieJarFile = null
if (localJarExists(hexieLocalJar)) {
    hexieJarFile = new File(hexieLocalJar)
    logger.lifecycle("[400AF] 使用本地 HeXie jar: ${hexieLocalJar}")
} else {
    def libsDir = new File(rootDir, 'libs')
    if (libsDir.isDirectory()) {
        def found = libsDir.listFiles()?.findAll { it.name.startsWith('Hexie') && it.name.endsWith('.jar') }
        if (found) {
            hexieJarFile = found.sort { it.name }.last()
            logger.lifecycle("[400AF] 使用 libs 里的 HeXie jar: ${hexieJarFile.name}")
        }
    }
}

if (hexieJarFile != null && hexieJarFile.isFile()) {
    dependencies {
        compileOnly files(hexieJarFile)
    }
} else {
    throw new GradleException(
            "[400AF] 找不到 HeXie 的 jar。请把 Hexie-*.jar 放到 libs/，" +
            "或在 gradle.local.properties 里设置 hexie_local_jar=<路径>。")
}

// ---------------------------------------------------------------------------
// 资源处理：把 gradle.properties 里的值替换进 neoforge.mods.toml / mixins
// ---------------------------------------------------------------------------
def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        create_version         : create_version,
        create_version_range   : create_version_range,
        hexie_modid            : hexie_modid,
        hexie_version_range    : hexie_version_range,
        simurail_version       : simurail_version,
        simurail_version_range : simurail_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties replaceProperties

    // 目录内的 _README.md 只是开发期说明，不能进发布包
    exclude '**/_README.md'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
    filesMatching(['**/*.mixins.json']) {
        // mixins 里一般不需要替换，留空但保留钩子
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
